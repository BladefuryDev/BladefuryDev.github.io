<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Pattern Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --lcars-bg: #000000;
            --lcars-text: #FFCC99;
            --lcars-primary: #6699FF;
            --lcars-secondary: #3366CC;
            --lcars-accent: #FF9900;
        }
        body {
            font-family: 'Antonio', sans-serif;
            background-color: var(--lcars-bg);
            color: var(--lcars-text);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .page-wrapper {
            padding: 1rem;
            max-width: 1000px;
            margin: auto;
        }
        .lcars-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .lcars-navbar {
            display: flex;
            width: 100%;
            height: 40px;
            border-radius: 0 10px 0 0;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }
        .navbar-elbow {
            width: 120px;
            background-color: var(--lcars-accent);
            border-radius: 20px 0 0 0;
            flex-shrink: 0;
        }
        .navbar-content {
            display: flex;
            justify-content: flex-end;
            align-items: stretch;
            width: 100%;
            background-color: var(--lcars-primary);
        }
        .system-id {
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            color: var(--lcars-bg);
            font-size: 1.2rem;
        }
        @media (max-width: 640px) {
            .system-id {
                font-size: 0.8rem;
            }
        }
        .lcars-main-content {
            flex-grow: 1;
        }
        .lcars-content-panel {
            padding: 1.5rem;
            border-top: 5px solid var(--lcars-secondary);
            border-right: 5px solid var(--lcars-secondary);
        }
        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .setting-item label {
            font-size: 1.1rem;
        }
        .lcars-input, .lcars-select {
            background-color: var(--lcars-bg);
            border: 2px solid var(--lcars-secondary);
            color: var(--lcars-text);
            font-family: 'Antonio', sans-serif;
            text-transform: uppercase;
            padding: 0.5rem 1rem;
            flex-grow: 1;
            width: 100%;
        }
        .timer-select {
             background-color: var(--lcars-bg);
            border: 2px solid var(--lcars-secondary);
            color: var(--lcars-text);
            font-family: 'Antonio', sans-serif;
            text-transform: uppercase;
            padding: 0.5rem;
            width: auto;
        }
        .lcars-input:focus, .lcars-select:focus, .timer-select:focus {
            outline: none;
            border-color: var(--lcars-primary);
        }
        .lcars-btn {
            background-color: var(--lcars-secondary);
            color: var(--lcars-text);
            padding: 0.75rem 1rem;
            text-align: center;
            transition: background-color 0.2s ease, color 0.2s ease;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 1.25rem;
            border-radius: 5px;
        }
        .lcars-btn.btn-accent {
            background-color: var(--lcars-accent);
            color: var(--lcars-bg);
        }
        .lcars-btn:hover {
            background-color: var(--lcars-text);
            color: var(--lcars-bg);
        }
        .frequency-display {
            display: flex;
            justify-content: space-around;
            margin-top: 1.5rem;
            background-color: #111;
            padding: 1rem;
            border-left: 5px solid var(--lcars-primary);
        }
        .freq-box { text-align: center; }
        .freq-box .label { font-size: 0.9rem; color: var(--lcars-primary); }
        .freq-box .value { font-size: 1.5rem; }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            background: var(--lcars-secondary);
            border-radius: 0;
            outline: none;
            flex-grow: 1;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 30px;
            background: var(--lcars-accent);
            cursor: pointer;
        }
         input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 30px;
            background: var(--lcars-accent);
            cursor: pointer;
        }
        .notice {
            background-color: #330000;
            border-left: 5px solid #CC0000;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }
        .timer-display {
            text-align: center;
            font-size: 1.5rem;
            margin-top: 1rem;
            color: var(--lcars-accent);
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="lcars-container">
            <header>
                <nav class="lcars-navbar">
                    <div class="navbar-elbow"></div>
                    <div class="navbar-content">
                        <div class="system-id">NEURAL PATTERN GENERATOR</div>
                    </div>
                </nav>
            </header>

            <main class="lcars-main-content">
                <section class="lcars-content-panel">
                    <div class="notice">
                        <strong>ATTENTION:</strong> Stereo headphones are required for proper auditory effect.
                    </div>

                    <div class="settings-array">
                        <!-- Presets -->
                        <div class="setting-item">
                            <label for="preset-select">Select Preset</label>
                            <select id="preset-select" class="lcars-select">
                                <option value="custom">Custom</option>
                                <option value="delta">Delta (2 Hz) - Deep Sleep</option>
                                <option value="theta">Theta (6 Hz) - Meditation</option>
                                <option value="alpha">Alpha (10 Hz) - Relaxation</option>
                                <option value="beta">Beta (20 Hz) - Focus</option>
                                <option value="gamma">Gamma (40 Hz) - Concentration</option>
                            </select>
                        </div>

                        <!-- Base Frequency -->
                        <div class="setting-item">
                            <div class="flex justify-between w-full">
                                <label for="base-freq">Base Frequency</label>
                                <span id="base-freq-value" class="text-right">300 HZ</span>
                            </div>
                            <input type="range" id="base-freq" min="100" max="1000" value="300" class="lcars-input w-full" title="Base Frequency" aria-label="Base Frequency">
                        </div>

                        <!-- Binaural Beat Frequency -->
                        <div class="setting-item">
                            <div class="flex justify-between w-full">
                                <label for="binaural-freq">Binaural Beat</label>
                                <span id="binaural-freq-value" class="text-right">10.0 HZ</span>
                            </div>
                            <input type="range" id="binaural-freq" min="1" max="50" value="10" step="0.5" class="lcars-input w-full" title="Binaural Beat Frequency" aria-label="Binaural Beat Frequency">
                        </div>
                        <div id="brainwave-state" class="text-center text-sm text-gray-500 dark:text-gray-400 mt-[-0.5rem] mb-2 font-medium uppercase">Alpha State</div>

                        <!-- Volume -->
                        <div class="setting-item">
                            <div class="flex justify-between w-full">
                                <label for="volume">Volume</label>
                                <span id="volume-value" class="text-right">-10 DB</span>
                            </div>
                            <input type="range" id="volume" min="-40" max="0" value="-10" step="1" class="lcars-input w-full" title="Volume" aria-label="Volume">
                        </div>

                        <!-- Timer -->
                        <div class="setting-item">
                            <label>Duration</label>
                            <div class="flex items-center gap-2">
                                <select id="hours" class="timer-select" title="Hours" aria-label="Hours"></select><span>H</span>
                                <select id="minutes" class="timer-select" title="Minutes" aria-label="Minutes"></select><span>M</span>
                                <select id="seconds" class="timer-select" title="Seconds" aria-label="Seconds"></select><span>S</span>
                            </div>
                        </div>
                    </div>

                    <button id="play-stop-btn" class="lcars-btn btn-accent mt-4">
                        Engage Audio Stream
                    </button>

                    <div id="timer-display" class="timer-display">00:00:00</div>

                    <div class="frequency-display">
                        <div class="freq-box">
                            <div class="label">Left Channel</div>
                            <div id="left-freq-display" class="value">300.0 HZ</div>
                        </div>
                        <div class="freq-box">
                            <div class="label">Right Channel</div>
                            <div id="right-freq-display" class="value">310.0 HZ</div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const playStopBtn = document.getElementById('play-stop-btn');
            const baseFreqSlider = document.getElementById('base-freq');
            const binauralFreqSlider = document.getElementById('binaural-freq');
            const volumeSlider = document.getElementById('volume');
            const presetSelect = document.getElementById('preset-select');
            const hoursSelect = document.getElementById('hours');
            const minutesSelect = document.getElementById('minutes');
            const secondsSelect = document.getElementById('seconds');
            const timerDisplay = document.getElementById('timer-display');

            const baseFreqValue = document.getElementById('base-freq-value');
            const binauralFreqValue = document.getElementById('binaural-freq-value');
            const volumeValue = document.getElementById('volume-value');
            const brainwaveState = document.getElementById('brainwave-state');
            const leftFreqDisplay = document.getElementById('left-freq-display');
            const rightFreqDisplay = document.getElementById('right-freq-display');

            let isPlaying = false;
            let oscL, oscR, pannerL, pannerR;
            let timerInterval;
            let remainingSeconds = 0;

            const presets = {
                delta: { beat: 2, base: 130 },
                theta: { beat: 6, base: 180 },
                alpha: { beat: 10, base: 250 },
                beta: { beat: 20, base: 300 },
                gamma: { beat: 40, base: 350 },
            };

            // --- Initialization ---
            function populateTimeSelects() {
                for (let i = 0; i < 24; i++) {
                    hoursSelect.innerHTML += `<option value="${i}">${String(i).padStart(2, '0')}</option>`;
                }
                for (let i = 0; i < 60; i++) {
                    minutesSelect.innerHTML += `<option value="${i}">${String(i).padStart(2, '0')}</option>`;
                    secondsSelect.innerHTML += `<option value="${i}">${String(i).padStart(2, '0')}</option>`;
                }
                minutesSelect.value = "20"; // Default to 20 minutes
            }

            // --- Audio Functions ---
            function setupAudio() {
                pannerL = new Tone.Panner(-1).toDestination();
                pannerR = new Tone.Panner(1).toDestination();
                oscL = new Tone.Oscillator({ type: 'sine' }).connect(pannerL);
                oscR = new Tone.Oscillator({ type: 'sine' }).connect(pannerR);
                updateFrequencies();
                updateVolume();
            }

            function getBrainwaveState(freq) {
                if (freq < 4) return 'Delta State';
                if (freq < 8) return 'Theta State';
                if (freq < 13) return 'Alpha State';
                if (freq < 38) return 'Beta State';
                return 'Gamma State';
            }
            
            function updateFrequencies() {
                const baseFreq = parseFloat(baseFreqSlider.value);
                const binauralFreq = parseFloat(binauralFreqSlider.value);
                const leftFreq = baseFreq;
                const rightFreq = baseFreq + binauralFreq;

                if (oscL && oscR) {
                    oscL.frequency.rampTo(leftFreq, 0.1);
                    oscR.frequency.rampTo(rightFreq, 0.1);
                }

                baseFreqValue.textContent = `${baseFreq.toFixed(0)} HZ`;
                binauralFreqValue.textContent = `${binauralFreq.toFixed(1)} HZ`;
                brainwaveState.textContent = getBrainwaveState(binauralFreq);
                leftFreqDisplay.textContent = `${leftFreq.toFixed(1)} HZ`;
                rightFreqDisplay.textContent = `${rightFreq.toFixed(1)} HZ`;
            }

            function updateVolume() {
                const volume = parseFloat(volumeSlider.value);
                if (oscL && oscR) {
                    oscL.volume.value = volume;
                    oscR.volume.value = volume;
                }
                volumeValue.textContent = `${volume.toFixed(0)} DB`;
            }

            function applyPreset() {
                const selected = presetSelect.value;
                if (selected !== 'custom' && presets[selected]) {
                    const preset = presets[selected];
                    binauralFreqSlider.value = preset.beat;
                    baseFreqSlider.value = preset.base;
                    updateFrequencies();
                }
            }

            // --- Timer Functions ---
            function formatTime(seconds) {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }

            function startTimer() {
                const hours = parseInt(hoursSelect.value);
                const minutes = parseInt(minutesSelect.value);
                const seconds = parseInt(secondsSelect.value);
                remainingSeconds = (hours * 3600) + (minutes * 60) + seconds;

                if (remainingSeconds <= 0) {
                    timerDisplay.textContent = "00:00:00";
                    return;
                }

                timerDisplay.textContent = formatTime(remainingSeconds);

                timerInterval = setInterval(() => {
                    remainingSeconds--;
                    timerDisplay.textContent = formatTime(remainingSeconds);
                    if (remainingSeconds <= 0) {
                        stopTimer();
                        if (isPlaying) {
                            playStopBtn.click(); // Programmatically stop playback
                        }
                    }
                }, 1000);
            }

            function stopTimer() {
                clearInterval(timerInterval);
                timerDisplay.textContent = "00:00:00";
            }
            
            // --- Event Listeners ---
            playStopBtn.addEventListener('click', async () => {
                if (Tone.context.state !== 'running') {
                    await Tone.start();
                }

                if (!isPlaying) {
                    if (!oscL) setupAudio();
                    oscL.start();
                    oscR.start();
                    startTimer();
                    playStopBtn.textContent = 'Disengage Audio Stream';
                    playStopBtn.style.backgroundColor = '#CC0000';
                } else {
                    if (oscL && oscR) {
                       oscL.stop();
                       oscR.stop();
                       oscL.dispose();
                       oscR.dispose();
                       pannerL.dispose();
                       pannerR.dispose();
                       oscL = null;
                       oscR = null;
                    }
                    stopTimer();
                    playStopBtn.textContent = 'Engage Audio Stream';
                    playStopBtn.style.backgroundColor = 'var(--lcars-accent)';
                }
                isPlaying = !isPlaying;
            });
            
            baseFreqSlider.addEventListener('input', () => {
                presetSelect.value = 'custom';
                updateFrequencies();
            });
            binauralFreqSlider.addEventListener('input', () => {
                 presetSelect.value = 'custom';
                updateFrequencies();
            });
            volumeSlider.addEventListener('input', updateVolume);
            presetSelect.addEventListener('change', applyPreset);
            
            // --- Initial Setup Calls ---
            populateTimeSelects();
            updateFrequencies();
            updateVolume();

            function handleTimeScroll(event, selectElement) {
                event.preventDefault();
                const direction = Math.sign(event.deltaY);
                let currentIndex = selectElement.selectedIndex;
                let newIndex = currentIndex - direction; // Inverted scrolling
                if (newIndex < 0) {
                    newIndex = selectElement.options.length - 1;
                } else if (newIndex >= selectElement.options.length) {
                    newIndex = 0;
                }
                selectElement.selectedIndex = newIndex;
            }

            hoursSelect.addEventListener('wheel', (e) => handleTimeScroll(e, hoursSelect));
            minutesSelect.addEventListener('wheel', (e) => handleTimeScroll(e, minutesSelect));
            secondsSelect.addEventListener('wheel', (e) => handleTimeScroll(e, secondsSelect));

            function handleSliderScroll(event, sliderElement) {
                event.preventDefault();
                const direction = Math.sign(event.deltaY);
                let currentValue = parseFloat(sliderElement.value);
                let step = parseFloat(sliderElement.step) || 1;
                let newValue = currentValue - direction * step; // Inverted scrolling
                let min = parseFloat(sliderElement.min);
                let max = parseFloat(sliderElement.max);

                if (newValue < min) {
                    newValue = min;
                } else if (newValue > max) {
                    newValue = max;
                }

                sliderElement.value = newValue;
                // Trigger the input event to update the UI and audio
                sliderElement.dispatchEvent(new Event('input'));
            }

            baseFreqSlider.addEventListener('wheel', (e) => handleSliderScroll(e, baseFreqSlider));
            binauralFreqSlider.addEventListener('wheel', (e) => handleSliderScroll(e, binauralFreqSlider));
            volumeSlider.addEventListener('wheel', (e) => handleSliderScroll(e, volumeSlider));
        });
    </script>
</body>
</html>
