                }
            }
        ];

        // Core Logic
        const characterListEl = document.getElementById('character-list');
        const contentDetailEl = document.getElementById('character-detail');
        const loadingOverlay = document.getElementById('loading-overlay');
        const bgGradient = document.getElementById('bg-gradient');
        const menuToggle = document.getElementById('menu-toggle');
        const menuClose = document.getElementById('menu-close');
        const sidebar = document.getElementById('sidebar');

        // Render Sidebar
        function renderList() {
            characterListEl.innerHTML = db.map(char => `
                <li class="group">
                    <button onclick="selectCharacter('${char.id}')" 
                            class="w-full text-left p-4 md:pl-6 border-l-2 border-transparent transition-all duration-300 hover:bg-white/5 hover:border-cyan-400 focus:outline-none"
                            id="btn-${char.id}">
                        <span class="block font-mono text-[10px] text-slate-500 uppercase tracking-widest mb-1 group-hover:text-cyan-400 transition-colors">Unit ID: ${char.id.toUpperCase()}</span>
                        <span class="block font-sans text-xl font-light text-slate-300 group-hover:text-white group-hover:translate-x-2 transition-transform">${char.name}</span>
                    </button>
                </li>
            `).join('');
        }

        // Handle Selection
        function selectCharacter(id) {
            const char = db.find(c => c.id === id);
            if (!char) return;

            // Close mobile menu
            if(window.innerWidth < 768) {
                sidebar.classList.add('-translate-x-full');
            }

            // Update URL
            window.location.hash = id;

            // Trigger Transition
            contentDetailEl.style.opacity = '0';
            contentDetailEl.style.transform = 'translateX(20px)';
            loadingOverlay.style.opacity = '1';

            // Active State on List
            document.querySelectorAll('li button').forEach(btn => {
                btn.classList.remove('bg-white/10', 'border-cyan-500');
                btn.classList.add('border-transparent');
            });
            const activeBtn = document.getElementById(`btn-${id}`);
            if(activeBtn) {
                activeBtn.classList.add('bg-white/10', 'border-cyan-500');
                activeBtn.classList.remove('border-transparent');
            }

            // Change Theme
            bgGradient.className = `absolute inset-0 bg-gradient-to-br transition-colors duration-1000 opacity-80 ${char.gradient}`;

            // Simulate Network Delay (Ace Combat Style)
            setTimeout(() => {
                renderContent(char);
                loadingOverlay.style.opacity = '0';
                contentDetailEl.style.opacity = '1';
                contentDetailEl.style.transform = 'translateX(0)';
            }, 300);
        }

        // Render HTML Content
        function renderContent(char) {
            const bioHtml = char.bio.map(p => `<p class="mb-4 text-slate-300 leading-relaxed">${p}</p>`).join('');
            
            const statsHtml = Object.entries(char.stats).map(([key, value]) => `
                <div class="border-b border-white/10 pb-1 mb-2">
                    <dt class="font-mono text-[10px] uppercase text-slate-500 tracking-wider">${key}</dt>
                    <dd class="font-mono text-sm text-cyan-100">${value}</dd>
                </div>
            `).join('');

            const movesetHtml = char.moveset.map(move => 
                `<span class="inline-block px-3 py-1 bg-white/5 border border-white/10 rounded-sm text-xs font-mono text-cyan-300 mr-2 mb-2">${move}</span>`
            ).join('');

            const specialInfoHtml = Object.entries(char.specialInfo).map(([key, value]) => `
                <div class="mb-6 p-4 bg-black/20 border-l-2 border-${char.theme}-500">
                    <h4 class="font-mono text-xs uppercase text-${char.theme}-400 mb-2 font-bold">${key}</h4>
                    <p class="text-sm text-slate-300">${value}</p>
                </div>
            `).join('');

            contentDetailEl.innerHTML = `
                <!-- Header Section -->
                <div class="flex flex-col md:flex-row gap-8 mb-10 animate-slide-in">
                    <!-- Image Card -->
                    <div class="w-full md:w-1/3 flex-shrink-0">
                        <div class="relative aspect-[3/4] bg-slate-800 border-2 border-white/10 rounded-sm overflow-hidden shadow-2xl shadow-black/50 group">
                            <!-- Placeholder / Image -->
                            <div class="absolute inset-0 bg-gradient-to-b from-slate-700 to-slate-900 flex items-center justify-center">
                                <span id="placeholder-text-${char.id}" class="font-mono text-xs text-slate-500 text-center px-4">
                                    [IMAGE DATA: ${char.id.toUpperCase()}]<br>
                                    <span class="text-[10px] opacity-50">Secure link required</span>
                                </span>
                            </div>
                            <!-- Dynamic Image Source Applied Here -->
                            <img src="${char.imageSrc}" 
                                 onload="document.getElementById('placeholder-text-${char.id}').style.display='none'; this.classList.remove('opacity-50', 'mix-blend-overlay');" 
                                 onerror="this.style.display='none'" 
                                 alt="${char.imageAlt}" 
                                 class="absolute inset-0 w-full h-full object-cover mix-blend-overlay opacity-50 transition-all duration-700">
                            
                            <!-- Overlay UI -->
                            <div class="absolute bottom-0 left-0 right-0 p-3 bg-gradient-to-t from-black/90 to-transparent">
                                <div class="font-mono text-[10px] text-cyan-400 mb-1">LOCATION ID</div>
                                <div class="text-xs text-white leading-tight">${char.stats.Residence}</div>
                            </div>
                        </div>
                    </div>

                    <!-- Quick Stats -->
                    <div class="w-full md:w-2/3 pt-2">
                         <div class="flex items-end mb-4 border-b border-white/20 pb-4">
                            <div>
                                <h1 class="text-4xl md:text-5xl font-bold text-white tracking-tight mb-1">${char.name}</h1>
                                <p class="font-mono text-sm text-cyan-400 tracking-widest uppercase">${char.role}</p>
                            </div>
                         </div>
                         
                         <div class="grid grid-cols-2 gap-x-8 gap-y-1">
                             ${statsHtml}
                         </div>

                         <div class="mt-6">
                            <h3 class="font-mono text-xs uppercase text-slate-500 mb-2">Combat Data / Moveset</h3>
                            <div class="flex flex-wrap">
                                ${movesetHtml}
                            </div>
                         </div>
                    </div>
                </div>

                <!-- Intel Sections -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 animate-slide-in" style="animation-delay: 0.1s;">
                    <!-- Left Col: Bio -->
                    <div class="lg:col-span-2 glass-panel p-6 rounded-sm">
                        <h3 class="flex items-center gap-2 font-mono text-sm uppercase text-white font-bold mb-6 pb-2 border-b border-white/10">
                            <span class="w-2 h-2 bg-cyan-500 rounded-full"></span>
                            Biographical Data
                        </h3>
                        <div class="space-y-4 text-justify">
                            ${bioHtml}
                        </div>
                    </div>

                    <!-- Right Col: Personality & Extras -->
                    <div class="space-y-6">
                        <div class="glass-panel p-6 rounded-sm">
                             <h3 class="font-mono text-sm uppercase text-white font-bold mb-4 pb-2 border-b border-white/10">Psychological Profile</h3>
                             <p class="text-sm text-slate-300 mb-4"><strong class="text-cyan-200">Personality:</strong> ${char.personality}</p>
                             <p class="text-sm text-slate-300 mb-4"><strong class="text-green-300">Likes:</strong> ${char.likes}</p>
                             <p class="text-sm text-slate-300"><strong class="text-red-300">Dislikes/Fears:</strong> ${char.dislikes}</p>
                        </div>

                        <div class="glass-panel p-6 rounded-sm">
                            <h3 class="font-mono text-sm uppercase text-white font-bold mb-4 pb-2 border-b border-white/10">Physical & Voice</h3>
                             <p class="text-sm text-slate-300 mb-4">${char.physical}</p>
                             <div class="bg-white/5 p-3 border-l-2 border-white/20">
                                <span class="block font-mono text-[10px] text-slate-500 uppercase mb-1">Voice Pattern</span>
                                <p class="text-xs text-slate-300 italic">"${char.voice}"</p>
                             </div>
                        </div>
                    </div>
                </div>

                <!-- Bottom Section: Special Info & Goals -->
                <div class="mt-8 grid grid-cols-1 lg:grid-cols-2 gap-8 animate-slide-in" style="animation-delay: 0.2s;">
                    <div>
                         <h3 class="font-mono text-sm uppercase text-white font-bold mb-4">Special Directives</h3>
                         ${specialInfoHtml}
                    </div>
                    <div class="glass-panel p-6 rounded-sm border-t-2 border-cyan-500">
                         <h3 class="font-mono text-sm uppercase text-white font-bold mb-4">Objective / Goals</h3>
                         <p class="text-slate-300 text-sm leading-relaxed">${char.goals}</p>
                    </div>
                </div>
            `;
        }

        // Event Listeners
        menuToggle.addEventListener('click', () => {
            sidebar.classList.remove('-translate-x-full');
        });

        menuClose.addEventListener('click', () => {
            sidebar.classList.add('-translate-x-full');
        });

        // Init
        window.addEventListener('load', () => {
            renderList();
            
            // Check Hash
            const hash = window.location.hash.replace('#', '');
            if (hash && db.some(c => c.id === hash)) {
                selectCharacter(hash);
            } else {
                // Auto select first char if desktop, otherwise wait
                if(window.innerWidth >= 768) {
                    selectCharacter(db[0].id);
                }
            }
        });

    </script>
</body>
</html>
