        /* --- Base & Default Theme Styles --- */
        :root {

            color: var(--default-text);

        #warp-background {

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;

            opacity: 0.6;
            transition: opacity 0.5s ease;

        .title-font {
            font-family: 'Orbitron', sans-serif;
        }
        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background-color: rgba(22, 30, 53, 0.7);
            border: 1px solid var(--default-primary);
            border-radius: 0.75rem;
            padding: 1.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease, border-color 0.3s ease;
            backdrop-filter: blur(5px);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s forwards;
            display: flex;
            flex-direction: column;
        }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 0 20px rgba(74, 111, 189, 0.5);
        }
        .card-content { flex-grow: 1; }
        .category-tag {
            background-color: var(--default-primary);
            color: var(--default-accent);
            font-size: 0.75rem;
            font-weight: 500;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }
        .category-icon {
            width: 1em;
            height: 1em;
            filter: invert(1);
        }
        .location-info {
            font-size: 0.8rem;
            color: #9ab5f5;
            padding-left: 1.25rem;
            position: relative;
            margin-top: 0.75rem;
            list-style: none;
        }
        .location-info::before {
            content: '⚬';
            font-size: 1.2em;
            position: absolute;
            left: 0; top: 50%;
            transform: translateY(-50%);
            color: var(--default-secondary);
        }
        .filter-btn {
            transition: all 0.2s ease;
            border: 1px solid var(--default-primary);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .filter-btn.active {
            background-color: var(--default-secondary);
            color: #ffffff;
            border-color: var(--default-secondary);
            transform: translateY(0);
        }
        .filter-btn:not(.active):hover {
            background-color: #314575;
            transform: translateY(-2px);
            border-color: var(--default-secondary);
        }
        .search-input, #sort-select {
            background-color: rgba(22, 30, 53, 0.7);
            border: 1px solid var(--default-primary);
            color: var(--default-text);
            border-radius: 0.5rem;
            padding: 0.5rem 1rem;

            border-color: var(--default-secondary);

            color: var(--lcars-tan);

            border: none;
            border-radius: 5px;
            text-transform: uppercase;
            padding: 0.25rem 1rem;

        .lcars-theme .filter-btn.active { background-color: var(--lcars-orange); color: var(--lcars-bg); }
        .lcars-theme .card {
            background-color: transparent;
            border: none;
            border-left: 5px solid var(--lcars-blue);
            border-bottom: 5px solid var(--lcars-blue);
            border-radius: 0;
            padding: 1rem;
            backdrop-filter: none;
        }
        .lcars-theme .card:hover { transform: translateY(0); box-shadow: none; border-color: var(--lcars-orange); }
        .lcars-theme .category-tag {
            background-color: var(--lcars-purple);
            color: var(--lcars-bg);
            border-radius: 5px;
            padding: 0.25rem 0.5rem;
            text-transform: uppercase;
        }
        .lcars-theme .category-icon {
            filter: none;
        }
        .lcars-theme .location-info { color: var(--lcars-blue); }
        .lcars-theme .location-info::before { content: '::'; color: var(--lcars-orange); }
        
        /* --- Theme Toggle Button --- */
        #theme-toggle-btn {
            background-color: var(--default-primary);
            color: var(--default-text);
            border: 1px solid var(--default-secondary);

        .lcars-theme .app-footer { color: var(--lcars-purple); font-family: 'Antonio', sans-serif; text-transform: uppercase; }

            { id: 'complete-lukari-tfos', name: "Complete Lukari TFOs", category: "TFOs", tip: "The 'Dranuur Gauntlet' TFO on Normal difficulty is a straightforward option for completion." },
            { id: 'complete-borg-tfos', name: "Complete Borg TFOs", category: "TFOs", tip: "The 'Infected: The Conduit' (Advanced) TFO is a popular and efficient option for completion." },
            { id: 'complete-iconian-tfos', name: "Complete Iconian TFOs", category: "TFOs", tip: "'Brotherhood of the Sword' is a common and direct option for completion." },

            // --- Other ---
            // Corrected: Added cost information.
            { id: 'gain-salvage', name: "Gain Salvage", category: "Other", tip: "Purchase and salvage Mark IX ground equipment (approx. 4,000 EC each) from any standard gear vendor (e.g., on Earth Spacedock) for a cost-effective method." },
            { id: 'harvest-materials-ground', name: "Harvest Materials (Ground)", category: "Other", tip: "The 'Sphere of Influence' mission offers repeatable nodes. Federation characters can also use the 'Diplomatic Order' mission for multiple nodes." },
            // Corrected: Added more patrol examples.
            { id: 'harvest-materials-space', name: "Harvest Materials (Space)", category: "Other", tip: "Enter patrols in the Tau Dewa Sector Block (e.g., Carraya, Beta Thoridor, Archer System, Starbase 234), harvest the anomaly nodes, and leave without fighting to repeat quickly.", location: "These patrols are in/near the Tau Dewa Sector Block (Beta Quadrant)." },
            { id: 'win-gold-pressed-latinum', name: "Win Gold Pressed Latinum", category: "Other", tip: "Play the Dabo mini-game, available at locations like Drozana Station or Deep Space 9." }
        ];

        const container = document.getElementById('endeavorContainer');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sort-select');
        const filtersContainer = document.getElementById('categoryFilters');
        const filterBar = document.getElementById('filterBar');
        const filtersWrapper = document.getElementById('filtersWrapper');
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        let activeFilter = 'All';
        let currentSort = 'alpha-asc';
        
        const renderEndeavors = (items) => {
            container.innerHTML = '';
            if (items.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 col-span-full">No endeavors found matching your criteria.</p>`;
                return;
            }
            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${index * 0.05}s`;
                let locationInfo = '';
                if (item.location) {
                    locationInfo = `<li class="location-info">${item.location}</li>`;
                }
                card.innerHTML = `
                    <div class="card-content">
                        <div class="flex justify-between items-start mb-3">
                            <h3 class="text-xl font-bold text-white pr-4">${item.name}</h3>
                            <span class="category-tag">
                                ${iconMap[item.category] || ''}
                                ${item.category}
                            </span>
                        </div>
                        <p class="text-gray-300">${item.tip}</p>
                    </div>
                    ${locationInfo}
                `;
                container.appendChild(card);
            });
        };

        const renderFilters = () => {
            const categories = ['All', ...new Set(endeavorData.map(item => item.category))];
            filtersContainer.innerHTML = categories.map(cat => `
                <button class="filter-btn px-4 py-2 rounded-full text-sm font-medium ${activeFilter === cat ? 'active' : ''}" data-category="${cat}">
                    ${iconMap[cat] || ''}
                    <span>${cat}</span>
                </button>
            `).join('');
        };

        const filterAndRender = () => {
            let filteredData = [...endeavorData];
            const searchTerm = searchInput.value.toLowerCase();

            // Filter
            if (activeFilter !== 'All') {
                filteredData = filteredData.filter(item => item.category === activeFilter);
            }
            if (searchTerm) {
                filteredData = filteredData.filter(item => 
                    item.name.toLowerCase().includes(searchTerm) || 
                    item.tip.toLowerCase().includes(searchTerm) ||
                    (item.location && item.location.toLowerCase().includes(searchTerm))
                );
            }

            // Sort
            if (currentSort === 'alpha-asc') {
                filteredData.sort((a, b) => a.name.localeCompare(b.name));
            } else if (currentSort === 'alpha-desc') {
                filteredData.sort((a, b) => b.name.localeCompare(a.name));
            }
            
            renderEndeavors(filteredData);
        };

        searchInput.addEventListener('input', filterAndRender);
        sortSelect.addEventListener('change', (e) => {
            currentSort = e.target.value;
            filterAndRender();
        });
        filtersContainer.addEventListener('click', (e) => {
            const button = e.target.closest('.filter-btn');
            if (button) {
                activeFilter = button.dataset.category;
                document.querySelectorAll('#categoryFilters .filter-btn').forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                filterAndRender();
            }
        });
        
        themeToggleBtn.addEventListener('click', () => {
            const isLcars = document.body.classList.toggle('lcars-theme');
            localStorage.setItem('theme', isLcars ? 'lcars' : 'default');
        });

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme !== 'default') { // Default to LCARS
                document.body.classList.add('lcars-theme');
            }
            renderFilters();
            filterAndRender();
        });

        // --- Warp Drive Background Logic ---
        const canvas = document.getElementById('warp-background');
        const ctx = canvas.getContext('2d');
        let stars = [];
        const numStars = 1000;
        const speed = 4;

        function setup() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: (Math.random() - 0.5) * canvas.width,
                    y: (Math.random() - 0.5) * canvas.height,
                    z: Math.random() * canvas.width
                });
            }
        }

        function draw() {
            ctx.fillStyle = 'rgba(10, 15, 30, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.fillStyle = 'white';
            for (let i = 0; i < stars.length; i++) {
                let star = stars[i];
                star.z -= speed;
                if (star.z < 1) {
                    star.z = canvas.width;
                    star.x = (Math.random() - 0.5) * canvas.width;
                    star.y = (Math.random() - 0.5) * canvas.height;
                }
                const sx = star.x / star.z * canvas.width / 10;
                const sy = star.y / star.z * canvas.height / 10;
                const r = Math.max(0.1, (1 - star.z / canvas.width) * 2);
                ctx.beginPath();
                ctx.arc(sx, sy, r, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', setup);
        setup();
        draw();
    </script>
</body>
